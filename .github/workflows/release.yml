name: Build & Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in VERSION after all builds pass
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  security:
    uses: ./.github/workflows/security.yml
  build:
    needs: [verify, security]
    strategy:
      # One leg failing must never cancel the others (v3.16.0: a single
      # broken runner used to cancel every build).
      fail-fast: false
      matrix:
        include:
          - os: macos-15        # Apple Silicon (arm64)
            asset: livepaste-macos-arm64
          - os: macos-15-intel        # Intel (x86_64)
            asset: livepaste-macos-x86_64
          - os: ubuntu-24.04    # Linux x86_64
            asset: livepaste-linux-x86_64
          - os: ubuntu-24.04-arm  # Linux arm64 (Raspberry Pi 4+, ARM servers)
            asset: livepaste-linux-arm64
          - os: windows-2025
            asset: livepaste-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build bundled frontend from source
        run: |
          corepack enable
          yarn --cwd frontend install --frozen-lockfile
          yarn --cwd frontend sync
      - name: Bake version into the binary
        shell: bash
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "__version__ = \"$VERSION\"" > livepaste/_version.py
          echo "Building LivePaste v$VERSION for ${{ matrix.asset }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller httpx

      - name: Build standalone binary
        run: |
          pyinstaller --onefile --name livepaste --paths . \
            --add-data "livepaste/static:livepaste/static" \
            --collect-submodules uvicorn \
            --collect-all pycrdt \
            --hidden-import aiosqlite \
            --hidden-import multipart \
            packaging/entry.py

      - name: Smoke test the binary
        shell: bash
        run: |
          BINARY=./dist/livepaste
          if [ "${{ runner.os }}" = "Windows" ]; then BINARY=./dist/livepaste.exe; fi
          mv "$BINARY" dist/${{ matrix.asset }}
          python scripts/smoke_install.py --binary dist/${{ matrix.asset }}
          python scripts/smoke_background.py --binary dist/${{ matrix.asset }}

      - name: Build one-click Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" | Select-Object -Last 1
          if (-not $compiler) { throw "Inno Setup compiler is missing" }
          $version = (Get-Content VERSION).Trim()
          & $compiler.FullName "/DAppVersion=$version" packaging/windows/livepaste.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }

      - name: Test Windows setup, upgrade, login launcher and uninstall
        if: runner.os == 'Windows'
        run: python scripts/smoke_windows_setup.py dist/livepaste-windows-x86_64-setup.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: livepaste-windows-x86_64-setup.exe
          path: dist/livepaste-windows-x86_64-setup.exe

  release:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum livepaste-* > SHA256SUMS
          cat SHA256SUMS

      - name: Prepare versioned release notes
        id: version
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = Path("VERSION").read_text().strip()
          tag = "v" + version
          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/") and ref != "refs/tags/" + tag:
              raise SystemExit("Tag does not match VERSION")
          text = Path("CHANGELOG.md").read_text()
          section = text.split("## [" + version + "]", 1)[1].split("\n## [", 1)[0]
          Path("release-notes.md").write_text("## LivePaste " + version + "\n\n" + section.split("\n", 1)[1].strip() + "\n\nWindows: download **livepaste-windows-x86_64-setup.exe** for one-click installation and sign-in startup. Saved data is retained on upgrades and uninstall. The Windows executable is currently unsigned.\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("tag=" + tag + "\n")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LivePaste ${{ steps.version.outputs.tag }} — Windows & reliable collaboration
          body_path: release-notes.md
          generate_release_notes: true
