[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "livepaste"
description = "Share text & code on your local network in real time \u2014 collaborative pastebin with inline images."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.25",
    "websockets>=12",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20",
    "pydantic>=2",
    "redis>=5.0",
]

[project.scripts]
livepaste = "livepaste.cli:main"

[project.urls]
Homepage = "https://github.com/NakshtraYadav/Live-Paste"
Repository = "https://github.com/NakshtraYadav/Live-Paste"
Changelog = "https://github.com/NakshtraYadav/Live-Paste/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["livepaste"]
include-package-data = true

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.package-data]
livepaste = ["static/**/*", "static/*"]
